<!DOCTYPE html>
<html lang="en" x-data="dashboard()" x-init="init()">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LIS Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #111827; }
    ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #4b5563; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen" style="font-family: ui-monospace, 'Cascadia Code', monospace;">

<!-- ==================== AUTH SCREEN ==================== -->
<div x-show="!authenticated" x-cloak class="fixed inset-0 bg-gray-950 flex items-center justify-center z-50">
  <div class="bg-gray-900 border border-gray-800 rounded-2xl p-8 w-full max-w-md shadow-2xl">
    <div class="flex items-center gap-3 mb-2">
      <div class="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold text-sm">LIS</div>
      <div>
        <h1 class="text-lg font-semibold text-white leading-tight">Log Ingestor Service</h1>
        <p class="text-xs text-gray-500">Dashboard</p>
      </div>
    </div>

    <div class="my-6 h-px bg-gray-800"></div>

    <div class="space-y-4">
      <div>
        <label class="block text-xs text-gray-400 mb-1.5 uppercase tracking-widest">API Key</label>
        <input
          type="password"
          x-model="authInput.key"
          @keydown.enter="login()"
          placeholder="lis_..."
          class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2.5 text-sm text-white placeholder-gray-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors"
        />
      </div>
      <div>
        <label class="block text-xs text-gray-400 mb-1.5 uppercase tracking-widest">Default Tenant <span class="text-gray-600 normal-case">(optional)</span></label>
        <input
          type="text"
          x-model="authInput.tenantId"
          @keydown.enter="login()"
          placeholder="acme"
          class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2.5 text-sm text-white placeholder-gray-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors"
        />
      </div>

      <div x-show="authError" class="text-xs text-red-400 bg-red-950/40 border border-red-900/40 rounded-lg px-3 py-2" x-text="authError"></div>

      <button
        @click="login()"
        class="w-full bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition-colors text-sm"
      >
        Open Dashboard
      </button>
      <button
        @click="loginDev()"
        class="w-full bg-transparent hover:bg-gray-800 text-gray-500 hover:text-gray-300 border border-gray-800 hover:border-gray-700 font-medium py-2.5 rounded-lg transition-colors text-sm"
      >
        Dev mode (no auth)
      </button>
    </div>
  </div>
</div>

<!-- ==================== MAIN APP ==================== -->
<div x-show="authenticated" x-cloak class="flex flex-col min-h-screen">

  <!-- Top Bar -->
  <header class="bg-gray-900 border-b border-gray-800 px-5 py-2.5 flex items-center justify-between sticky top-0 z-40 gap-4 flex-wrap">
    <div class="flex items-center gap-3">
      <div class="w-7 h-7 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold text-[10px]">LIS</div>
      <span class="text-sm font-semibold text-white">Log Ingestor</span>
    </div>

    <div class="flex items-center gap-3 flex-wrap">
      <!-- Tenant -->
      <div class="flex items-center gap-2">
        <span class="text-[10px] text-gray-500 uppercase tracking-widest hidden sm:block">Tenant</span>
        <input
          type="text"
          x-model="tenantId"
          @change="onTenantChange()"
          placeholder="all tenants"
          class="bg-gray-800 border border-gray-700 rounded-md px-3 py-1.5 text-xs text-white w-32 focus:outline-none focus:border-indigo-500 placeholder-gray-600 transition-colors"
        />
      </div>

      <!-- Time range -->
      <select
        x-model="timeRange"
        @change="refresh()"
        class="bg-gray-800 border border-gray-700 rounded-md px-3 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500 transition-colors"
      >
        <option value="1h">Last 1h</option>
        <option value="6h">Last 6h</option>
        <option value="24h">Last 24h</option>
        <option value="7d">Last 7d</option>
      </select>

      <!-- Live indicator -->
      <button
        @click="toggleAutoRefresh()"
        class="flex items-center gap-1.5 px-3 py-1.5 rounded-md border text-xs transition-colors"
        :class="autoRefresh ? 'border-green-800 text-green-400 bg-green-950/30' : 'border-gray-700 text-gray-500'"
      >
        <span x-show="autoRefresh" class="w-1.5 h-1.5 bg-green-400 rounded-full animate-pulse"></span>
        <span x-text="autoRefresh ? 'Live' : 'Paused'"></span>
      </button>

      <!-- Manual refresh -->
      <button
        @click="refresh()"
        :disabled="loading"
        class="px-3 py-1.5 rounded-md border border-gray-700 text-xs text-gray-400 hover:text-white hover:border-gray-500 transition-colors disabled:opacity-40"
      >
        Refresh
      </button>

      <!-- Logout -->
      <button @click="logout()" class="text-xs text-gray-600 hover:text-red-400 transition-colors">Logout</button>
    </div>
  </header>

  <!-- Error Banner -->
  <div
    x-show="globalError"
    x-cloak
    class="bg-red-950/40 border-b border-red-900/40 px-5 py-2 text-xs text-red-300 flex items-center justify-between"
  >
    <span x-text="globalError"></span>
    <button @click="globalError = null" class="text-red-600 hover:text-red-400 ml-4 transition-colors">dismiss</button>
  </div>

  <!-- Content -->
  <main class="p-5 space-y-5 flex-1">

    <!-- Stat Cards -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
      <template x-for="card in statCards" :key="card.label">
        <div class="bg-gray-900 border border-gray-800 rounded-xl p-4 space-y-1">
          <div class="text-[10px] text-gray-500 uppercase tracking-widest" x-text="card.label"></div>
          <div class="text-2xl font-semibold leading-tight" :class="card.color" x-text="card.value"></div>
          <div class="text-[11px] text-gray-600" x-text="card.sub"></div>
        </div>
      </template>
    </div>

    <!-- Charts Row -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">

      <!-- Timeline (2/3) -->
      <div class="lg:col-span-2 bg-gray-900 border border-gray-800 rounded-xl p-4">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-xs font-medium text-gray-400 uppercase tracking-widest">Events over time</h2>
          <div x-show="tenantId" class="flex gap-1">
            <button
              @click="timelineInterval = 'hour'; loadTimeline()"
              class="text-[11px] px-2 py-0.5 rounded transition-colors"
              :class="timelineInterval === 'hour' ? 'bg-indigo-600 text-white' : 'text-gray-500 hover:text-gray-300'"
            >Hour</button>
            <button
              @click="timelineInterval = 'day'; loadTimeline()"
              class="text-[11px] px-2 py-0.5 rounded transition-colors"
              :class="timelineInterval === 'day' ? 'bg-indigo-600 text-white' : 'text-gray-500 hover:text-gray-300'"
            >Day</button>
          </div>
        </div>
        <div class="relative h-52">
          <canvas id="timelineChart"></canvas>
          <div
            x-show="!tenantId"
            class="absolute inset-0 flex flex-col items-center justify-center gap-2 text-gray-700"
          >
            <svg class="w-8 h-8 opacity-40" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z"/></svg>
            <span class="text-xs">Set a tenant to see analytics</span>
          </div>
        </div>
      </div>

      <!-- Level Breakdown (1/3) -->
      <div class="bg-gray-900 border border-gray-800 rounded-xl p-4">
        <h2 class="text-xs font-medium text-gray-400 uppercase tracking-widest mb-4">Level breakdown</h2>
        <div class="relative h-52">
          <canvas id="levelChart"></canvas>
          <div
            x-show="!tenantId"
            class="absolute inset-0 flex flex-col items-center justify-center gap-2 text-gray-700"
          >
            <svg class="w-8 h-8 opacity-40" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z"/></svg>
            <span class="text-xs">Set a tenant</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Top Sources -->
    <div x-show="tenantId" class="bg-gray-900 border border-gray-800 rounded-xl p-4">
      <h2 class="text-xs font-medium text-gray-400 uppercase tracking-widest mb-4">Top sources</h2>
      <div class="relative h-36">
        <canvas id="sourcesChart"></canvas>
      </div>
    </div>

    <!-- Log Stream -->
    <div class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden">

      <!-- Filter Bar -->
      <div class="p-4 border-b border-gray-800 flex items-center gap-3 flex-wrap">
        <h2 class="text-xs font-medium text-gray-400 uppercase tracking-widest shrink-0">Log stream</h2>

        <input
          type="text"
          x-model="filters.source"
          @input.debounce.400ms="filterLogs()"
          placeholder="source..."
          class="bg-gray-800 border border-gray-700 rounded-md px-3 py-1.5 text-xs text-white w-28 focus:outline-none focus:border-indigo-500 placeholder-gray-600 transition-colors"
        />

        <select
          x-model="filters.level"
          @change="filterLogs()"
          class="bg-gray-800 border border-gray-700 rounded-md px-3 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500 transition-colors"
        >
          <option value="">All levels</option>
          <option value="debug">debug</option>
          <option value="info">info</option>
          <option value="warn">warn</option>
          <option value="error">error</option>
          <option value="fatal">fatal</option>
        </select>

        <select
          x-model="filters.environment"
          @change="filterLogs()"
          class="bg-gray-800 border border-gray-700 rounded-md px-3 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500 transition-colors"
        >
          <option value="">All envs</option>
          <option value="dev">dev</option>
          <option value="staging">staging</option>
          <option value="prod">prod</option>
        </select>

        <input
          type="text"
          x-model="filters.q"
          @input.debounce.400ms="filterLogs()"
          placeholder="search messages..."
          class="bg-gray-800 border border-gray-700 rounded-md px-3 py-1.5 text-xs text-white flex-1 min-w-40 focus:outline-none focus:border-indigo-500 placeholder-gray-600 transition-colors"
        />

        <span class="text-[11px] text-gray-600 ml-auto shrink-0" x-show="total > 0" x-text="total.toLocaleString() + ' events'"></span>
      </div>

      <!-- Table -->
      <div class="overflow-x-auto">
        <table class="w-full text-xs">
          <thead>
            <tr class="border-b border-gray-800 text-gray-500">
              <th class="text-left px-4 py-2.5 font-normal whitespace-nowrap">Time</th>
              <th class="text-left px-4 py-2.5 font-normal">Level</th>
              <th class="text-left px-4 py-2.5 font-normal">Tenant</th>
              <th class="text-left px-4 py-2.5 font-normal">Source</th>
              <th class="text-left px-4 py-2.5 font-normal">Env</th>
              <th class="text-left px-4 py-2.5 font-normal w-full">Message</th>
            </tr>
          </thead>
          <tbody>
            <tr x-show="loading && logs.length === 0">
              <td colspan="6" class="px-4 py-10 text-center text-gray-700">
                <div class="flex items-center justify-center gap-2">
                  <svg class="animate-spin w-4 h-4 text-indigo-500" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                  <span>Loading...</span>
                </div>
              </td>
            </tr>
            <tr x-show="!loading && logs.length === 0">
              <td colspan="6" class="px-4 py-10 text-center text-gray-700">No logs found</td>
            </tr>

            <template x-for="log in logs" :key="log.id">
              <tr
                @click="selectedLog = selectedLog?.id === log.id ? null : log"
                class="border-b border-gray-800/60 hover:bg-gray-800/40 cursor-pointer transition-colors"
                :class="selectedLog?.id === log.id ? 'bg-gray-800/50' : ''"
              >
                <td class="px-4 py-2 text-gray-500 whitespace-nowrap" x-text="fmtTime(log.occurred_at)"></td>
                <td class="px-4 py-2">
                  <span
                    class="px-1.5 py-0.5 rounded text-[10px] font-medium uppercase tracking-wide"
                    :class="levelBadge(log.level)"
                    x-text="log.level"
                  ></span>
                </td>
                <td class="px-4 py-2 text-gray-400 whitespace-nowrap" x-text="log.tenant_id"></td>
                <td class="px-4 py-2 text-gray-400 whitespace-nowrap" x-text="log.source"></td>
                <td class="px-4 py-2 text-gray-500" x-text="log.environment"></td>
                <td class="px-4 py-2 text-gray-200 max-w-xl">
                  <span class="truncate block" x-text="log.message"></span>
                </td>
              </tr>

              <!-- Expanded Detail -->
              <tr x-show="selectedLog?.id === log.id" class="bg-gray-800/20">
                <td colspan="6" class="px-4 py-4 border-b border-gray-800/60">
                  <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3 mb-3">
                    <template x-for="[k, v] in detailFields(log)" :key="k">
                      <div>
                        <div class="text-[10px] text-gray-500 uppercase tracking-widest mb-0.5" x-text="k"></div>
                        <div class="text-[11px] text-gray-300 break-all" x-text="v"></div>
                      </div>
                    </template>
                  </div>
                  <template x-if="log.exception">
                    <div class="mt-3">
                      <div class="text-[10px] text-gray-500 uppercase tracking-widest mb-1.5">Exception</div>
                      <pre class="bg-red-950/30 border border-red-900/30 rounded-lg px-3 py-2 text-[11px] text-red-300 overflow-x-auto leading-relaxed" x-text="JSON.stringify(log.exception, null, 2)"></pre>
                    </div>
                  </template>
                  <template x-if="log.properties">
                    <div class="mt-3">
                      <div class="text-[10px] text-gray-500 uppercase tracking-widest mb-1.5">Properties</div>
                      <pre class="bg-gray-800/60 border border-gray-700/60 rounded-lg px-3 py-2 text-[11px] text-gray-300 overflow-x-auto leading-relaxed" x-text="JSON.stringify(log.properties, null, 2)"></pre>
                    </div>
                  </template>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>

      <!-- Pagination -->
      <div x-show="total > limit" class="p-3 border-t border-gray-800 flex items-center justify-between">
        <button
          @click="prevPage()"
          :disabled="page === 1"
          class="text-xs text-gray-500 hover:text-white disabled:opacity-30 px-3 py-1.5 rounded-md border border-gray-700 hover:border-gray-500 transition-colors"
        >Prev</button>
        <span class="text-xs text-gray-600" x-text="`Page ${page} of ${Math.ceil(total / limit)}`"></span>
        <button
          @click="nextPage()"
          :disabled="page >= Math.ceil(total / limit)"
          class="text-xs text-gray-500 hover:text-white disabled:opacity-30 px-3 py-1.5 rounded-md border border-gray-700 hover:border-gray-500 transition-colors"
        >Next</button>
      </div>
    </div>

  </main>
</div>

<!-- ==================== SCRIPT ==================== -->
<script>
function dashboard() {
  return {
    // Auth
    authenticated: false,
    authInput: { key: '', tenantId: '' },
    authError: null,
    apiKey: '',

    // Tenant / time
    tenantId: '',
    timeRange: '24h',
    timelineInterval: 'hour',

    // Logs
    logs: [],
    total: 0,
    page: 1,
    limit: 50,
    selectedLog: null,
    filters: { level: '', source: '', environment: '', q: '' },

    // Analytics
    summary: null,

    // Chart instances
    _charts: {},

    // UI
    loading: false,
    globalError: null,
    autoRefresh: true,
    _timer: null,

    // ---- Computed stat cards ----
    get statCards() {
      const s = this.summary;
      if (!s) {
        return [
          { label: 'Total events', value: '--', color: 'text-white', sub: 'select a tenant' },
          { label: 'Errors + Fatal', value: '--', color: 'text-red-400', sub: '' },
          { label: 'Warnings', value: '--', color: 'text-yellow-400', sub: '' },
          { label: 'Matching logs', value: this.total > 0 ? this.total.toLocaleString() : '0', color: 'text-indigo-400', sub: 'in table' },
        ];
      }
      const bl = s.by_level || {};
      const grand = Object.values(bl).reduce((a, b) => a + b, 0);
      const errors = (bl.error || 0) + (bl.fatal || 0);
      const warns = bl.warn || bl.warning || 0;
      const errPct = grand > 0 ? ((errors / grand) * 100).toFixed(1) : '0';
      return [
        { label: 'Total events', value: grand.toLocaleString(), color: 'text-white', sub: 'in selected range' },
        { label: 'Errors + Fatal', value: errors.toLocaleString(), color: errors > 0 ? 'text-red-400' : 'text-gray-400', sub: errPct + '% error rate' },
        { label: 'Warnings', value: warns.toLocaleString(), color: warns > 0 ? 'text-yellow-400' : 'text-gray-400', sub: '' },
        { label: 'Matching logs', value: this.total.toLocaleString(), color: 'text-indigo-400', sub: 'in table' },
      ];
    },

    // ---- Lifecycle ----

    init() {
      Chart.defaults.color = '#6b7280';
      Chart.defaults.borderColor = '#1f2937';
      Chart.defaults.font.family = "ui-monospace, 'Cascadia Code', monospace";
      Chart.defaults.font.size = 11;

      const key = localStorage.getItem('lis_key');
      if (key !== null) {
        this.apiKey = key;
        this.tenantId = localStorage.getItem('lis_tenant') || '';
        this.authenticated = true;
        this.$nextTick(() => this.refresh());
      }
    },

    login() {
      this.authError = null;
      this.apiKey = this.authInput.key.trim();
      this.tenantId = this.authInput.tenantId.trim();
      localStorage.setItem('lis_key', this.apiKey);
      localStorage.setItem('lis_tenant', this.tenantId);
      this.authenticated = true;
      this.$nextTick(() => this.refresh());
    },

    loginDev() {
      this.authInput.key = '';
      this.login();
    },

    logout() {
      clearInterval(this._timer);
      localStorage.removeItem('lis_key');
      localStorage.removeItem('lis_tenant');
      this.authenticated = false;
      this.apiKey = '';
      this.logs = [];
      this.summary = null;
      this._destroyCharts();
    },

    onTenantChange() {
      localStorage.setItem('lis_tenant', this.tenantId);
      this.page = 1;
      this.refresh();
    },

    toggleAutoRefresh() {
      this.autoRefresh = !this.autoRefresh;
      if (this.autoRefresh) {
        this._startTimer();
      } else {
        clearInterval(this._timer);
      }
    },

    _startTimer() {
      clearInterval(this._timer);
      this._timer = setInterval(() => this.refresh(), 15000);
    },

    // ---- API helpers ----

    _headers() {
      const h = { 'Content-Type': 'application/json' };
      if (this.apiKey) h['Authorization'] = `Bearer ${this.apiKey}`;
      return h;
    },

    _timeWindow() {
      const now = new Date();
      const map = { '1h': 1, '6h': 6, '24h': 24, '7d': 168 };
      const hrs = map[this.timeRange] || 24;
      const from = new Date(now.getTime() - hrs * 3_600_000);
      return { from_dt: from.toISOString(), to_dt: now.toISOString() };
    },

    async _fetch(path, params = {}) {
      const url = new URL(path, window.location.origin);
      for (const [k, v] of Object.entries(params)) {
        if (v !== '' && v !== null && v !== undefined) url.searchParams.set(k, String(v));
      }
      const resp = await fetch(url.toString(), { headers: this._headers() });
      if (!resp.ok) {
        const body = await resp.json().catch(() => ({}));
        throw new Error(body.detail || `HTTP ${resp.status}`);
      }
      return resp.json();
    },

    // ---- Load ----

    async refresh() {
      if (this.loading) return;
      this.loading = true;
      this.globalError = null;
      try {
        await Promise.all([this.loadLogs(), this.loadAnalytics()]);
        if (this.autoRefresh) this._startTimer();
      } catch (e) {
        this.globalError = e.message;
      } finally {
        this.loading = false;
      }
    },

    async loadLogs() {
      const tw = this._timeWindow();
      const data = await this._fetch('/v1/logs', {
        tenant_id: this.tenantId || undefined,
        level: this.filters.level,
        source: this.filters.source,
        environment: this.filters.environment,
        q: this.filters.q,
        from_dt: tw.from_dt,
        to_dt: tw.to_dt,
        page: this.page,
        limit: this.limit,
      });
      this.logs = data.items;
      this.total = data.total;
    },

    async loadAnalytics() {
      if (!this.tenantId) {
        this.summary = null;
        this._destroyCharts();
        return;
      }
      const tw = this._timeWindow();
      const [summary, sources] = await Promise.all([
        this._fetch('/v1/analytics/summary', { tenant_id: this.tenantId, ...tw }),
        this._fetch('/v1/analytics/top-sources', { tenant_id: this.tenantId, n: 8, ...tw }),
      ]);
      this.summary = summary;
      this.$nextTick(() => {
        this._renderLevel(summary.by_level || {});
        this._renderSources(sources);
      });
      await this.loadTimeline();
    },

    async loadTimeline() {
      if (!this.tenantId) return;
      const tw = this._timeWindow();
      const buckets = await this._fetch('/v1/analytics/timeline', {
        tenant_id: this.tenantId,
        interval: this.timelineInterval,
        ...tw,
      });
      this.$nextTick(() => this._renderTimeline(buckets));
    },

    filterLogs() {
      this.page = 1;
      this.loadLogs().catch(e => { this.globalError = e.message; });
    },

    prevPage() {
      if (this.page > 1) { this.page--; this.loadLogs().catch(e => { this.globalError = e.message; }); }
    },

    nextPage() {
      if (this.page < Math.ceil(this.total / this.limit)) {
        this.page++;
        this.loadLogs().catch(e => { this.globalError = e.message; });
      }
    },

    // ---- Charts ----

    _destroyCharts() {
      for (const c of Object.values(this._charts)) c?.destroy();
      this._charts = {};
    },

    _renderTimeline(buckets) {
      const ctx = document.getElementById('timelineChart');
      if (!ctx) return;
      this._charts.timeline?.destroy();
      this._charts.timeline = new Chart(ctx, {
        type: 'line',
        data: {
          labels: buckets.map(b => this._fmtBucket(b.bucket)),
          datasets: [{
            label: 'Events',
            data: buckets.map(b => b.count),
            borderColor: '#6366f1',
            backgroundColor: 'rgba(99,102,241,0.08)',
            fill: true,
            tension: 0.35,
            pointRadius: buckets.length < 30 ? 3 : 0,
            pointHoverRadius: 4,
            borderWidth: 2,
          }],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { color: '#1f2937' }, ticks: { maxTicksLimit: 10 } },
            y: { grid: { color: '#1f2937' }, beginAtZero: true, ticks: { precision: 0 } },
          },
        },
      });
    },

    _renderLevel(byLevel) {
      const ctx = document.getElementById('levelChart');
      if (!ctx) return;
      this._charts.level?.destroy();
      const PALETTE = {
        debug: '#374151',
        info: '#6366f1',
        warn: '#f59e0b',
        warning: '#f59e0b',
        error: '#ef4444',
        fatal: '#7c3aed',
      };
      const labels = Object.keys(byLevel).filter(k => byLevel[k] > 0);
      if (!labels.length) return;
      this._charts.level = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels,
          datasets: [{
            data: labels.map(l => byLevel[l]),
            backgroundColor: labels.map(l => PALETTE[l] || '#4b5563'),
            borderWidth: 0,
            hoverOffset: 4,
          }],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: '68%',
          plugins: {
            legend: {
              position: 'right',
              labels: { boxWidth: 10, padding: 14, font: { size: 11 } },
            },
          },
        },
      });
    },

    _renderSources(sources) {
      const ctx = document.getElementById('sourcesChart');
      if (!ctx) return;
      this._charts.sources?.destroy();
      if (!sources.length) return;
      this._charts.sources = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: sources.map(s => s.source),
          datasets: [{
            label: 'Events',
            data: sources.map(s => s.count),
            backgroundColor: '#6366f1',
            borderRadius: 3,
            hoverBackgroundColor: '#818cf8',
          }],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          indexAxis: 'y',
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { color: '#1f2937' }, beginAtZero: true, ticks: { precision: 0 } },
            y: { grid: { display: false } },
          },
        },
      });
    },

    // ---- Helpers ----

    fmtTime(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      return d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' })
        + ' ' + d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
    },

    _fmtBucket(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      return this.timelineInterval === 'day'
        ? d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' })
        : d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    },

    levelBadge(level) {
      return {
        debug:   'bg-gray-700 text-gray-400',
        info:    'bg-indigo-900/70 text-indigo-300',
        warn:    'bg-yellow-900/60 text-yellow-300',
        warning: 'bg-yellow-900/60 text-yellow-300',
        error:   'bg-red-900/60 text-red-300',
        fatal:   'bg-purple-900/60 text-purple-300',
      }[level] || 'bg-gray-700 text-gray-400';
    },

    detailFields(log) {
      return [
        ['ID', log.id],
        ['Trace ID', log.trace_id],
        ['Span ID', log.span_id],
        ['Correlation', log.correlation_id],
        ['Request ID', log.request_id],
        ['User ID', log.user_id],
        ['Path', log.path],
        ['Method', log.method],
        ['Status', log.status_code],
        ['Duration', log.duration_ms != null ? log.duration_ms + 'ms' : null],
        ['Type', log.type],
        ['Occurred', log.occurred_at],
      ].filter(([, v]) => v !== null && v !== undefined);
    },
  };
}
</script>
</body>
</html>
